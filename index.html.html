<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(40px, 5.4vw, 64px); line-height: 1.04; letter-spacing: -0.01em">El carácter del vino, <em style="color: #5B1A33">en la cocina de tu restaurante.</em></h1>

<!-- USOS -->
<section id="usos" aria-labelledby="usos-t" style="background: #EFE4D6">
<div style="max-width: 1200px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 46em">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5A1F; font-weight: 700">Usos en cocina</p>
<h2 id="usos-t" style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.1">No reemplaza a tu harina: la potencia</h2>
<p style="margin: 0; color: #4A3D3E; font-size: 17px">Se usa en proporciones bajas, combinada con harina de trigo u otras bases sin gluten. Cada aplicación viene con su ficha de dosificación.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
<sc-for list="{{ usos }}" as="u" hint-placeholder-count="5">
<div style="background: #FFFFFF; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 21px">{{ u.t }}</h3>
<p style="margin: 0; color: #4A3D3E; font-size: 15px; flex-grow: 1">{{ u.d }}</p>
<p style="margin: 0; font-size: 13px; color: #5B1A33; font-weight: 700"><br></p>
</div>
</sc-for>
</div>
<div style="background: #5B1A33; color: #FFFFFF; border-radius: 18px; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 420px">
<span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #F0D9A6; font-weight: 700">Para tu carta</span>
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 22px; line-height: 1.35; font-style: italic">«Fettuccine artesanal con harina de uva VITAVIN de los Valles Calchaquíes, ragú de cordero.»</p>
</div>
<p style="margin: 0; flex: 1 1 280px; color: #F3E6EA; font-size: 15px">Te damos textos sugeridos para la carta, el maridaje recomendado y material para redes, sin costo para clientes con suscripción.</p>
</div>
</div>
</section>

<!-- SUSCRIPCIÓN -->
<section id="suscripcion" aria-labelledby="sus-t" style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 48em">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5A1F; font-weight: 700">Suscripción de suministro flexible</p>
<h2 id="sus-t" style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.1">Pagás un cupo mensual. Los kilos que no usás, se guardan.</h2>
<p style="margin: 0; color: #4A3D3E; font-size: 17px">Tu cocina no consume igual en marzo que en las vacaciones de invierno. Con el cupo dinámico, lo que no usás en temporada baja se acumula para la temporada alta, con precio congelado durante el plan.</p>
</div>

<div role="radiogroup" aria-label="Elegí un plan" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{ planes }}" as="p" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ p.checked }}" onClick="{{ p.pick }}" style="{{ p.cardStyle }}"><span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A5A1F; font-weight: 700">{{ p.para }}</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px">{{ p.nombre }}</span>
<span style="font-size: 15px; color: #4A3D3E">Cupo de <strong>{{ p.cupo }} kg</strong> por mes</span>
<span style="font-size: 15px; color: #4A3D3E">Precio por kg: <strong>42.000 ARS</strong></span>
</button>
</sc-for>
</div>

<div style="background: #FFFFFF; border: 1px solid #E3D6C6; border-radius: 20px; padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px">

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(s) { Object.assign(this.state, s); window.__render(); }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'pro', frec: 'quincenal', enviado: false, open: 0 };
  }
  renderVals() {
    var self = this;
    var planes = [
      { id: 'inicial', nombre: 'Inicial', para: 'Bistró o carta corta', cupo: 5 },
      { id: 'pro', nombre: 'Profesional', para: 'Restaurante de autor', cupo: 15 },
      { id: 'alto', nombre: 'Alto volumen', para: 'Hotel o grupo gastronómico', cupo: 30 }
    ];
    var actual = planes.filter(function (p) { return p.id === self.state.plan; })[0];
    var cupo = actual.cupo;
    var temporada = [['Mar', 0.6], ['Abr', 0.8], ['May', 0.7], ['Jun', 1.0], ['Jul', 1.5], ['Ago', 1.2]];
    var saldo = 0, usadosSaldo = 0, maxUso = 0;
    var meses = temporada.map(function (t) {
      var uso = Math.round(cupo * t[1]);
      var deSaldo = 0;
      if (uso <= cupo) { saldo += cupo - uso; }
      else { deSaldo = Math.min(saldo, uso - cupo); saldo -= deSaldo; usadosSaldo += deSaldo; }
      if (uso > maxUso) maxUso = uso;
      return { mes: t[0], uso: uso, saldo: saldo, deSaldo: deSaldo };
    });
    meses = meses.map(function (m) {
      var h = Math.max(8, Math.round((m.uso / maxUso) * 160));
      var color = m.deSaldo > 0 ? '#B8892E' : '#5B1A33';
      return Object.assign({}, m, { barStyle: 'width: 100%; max-width: 56px; height: ' + h + 'px; background: ' + color + '; border-radius: 8px 8px 0 0' });
    });
    var frecs = [
      { id: 'semanal', label: 'Semanal', n: 4 },
      { id: 'quincenal', label: 'Quincenal', n: 2 },
      { id: 'mensual', label: 'Mensual', n: 1 }
    ];
    var fAct = frecs.filter(function (f) { return f.id === self.state.frec; })[0];
    var porEntrega = Math.round((cupo / fAct.n) * 10) / 10;
    var faqData = [
      ['¿Reemplaza a la harina de trigo?', 'No. Se usa en una proporción baja combinada con tu harina habitual o con una base sin gluten. Aporta color, sabor y fibra; cada ficha indica la dosis recomendada por aplicación.'],
      ['¿Qué pasa con los kilos que no uso en el mes?', 'Quedan como saldo a tu favor y los podés usar en los meses de más demanda, dentro del plazo de acumulación de tu plan.'],
      ['¿Puedo cambiar de plan o pausar la suscripción?', 'Sí. Podés subir, bajar o pausar tu cupo avisando con la anticipación que indica tu plan.'],
      ['¿Es apta para celíacos?', 'La harina de uva no contiene gluten por naturaleza. La certificación oficial Sin TACC está en trámite; hasta obtenerla no la presentamos como apta para celíacos.'],
      ['¿Cuánto dura y cómo se conserva?', 'En el envase cerrado, [X] meses. Una vez abierto, mantené el cierre hermético y guardala lejos de la luz y la humedad.'],
      ['¿A qué zonas entregan y cómo facturan?', 'Entregamos en [ZONAS DE COBERTURA] con entrega programada. Emitimos factura [TIPO] y la cobranza se hace en forma mensual según tu plan.']
    ];
    return {
      planNombre: actual.nombre,
      cupo: cupo,
      planes: planes.map(function (p) {
        var on = p.id === self.state.plan;
        return Object.assign({}, p, {
          checked: on ? 'true' : 'false',
          pick: function () { self.setState({ plan: p.id }); },
          cardStyle: 'text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 22px; border-radius: 18px; font-family: inherit; color: #241B1C; ' + (on ? 'background: #FFFFFF; border: 2px solid #5B1A33; box-shadow: 0 6px 20px rgba(91,26,51,0.14)' : 'background: #FBF7F1; border: 2px solid #E3D6C6')
        });
      }),
      meses: meses,
      usadosSaldo: usadosSaldo,
      chartLabel: 'Consumo mensual de marzo a agosto con el plan ' + actual.nombre + ': ' + meses.map(function (m) { return m.mes + ' ' + m.uso + ' kg'; }).join(', '),
      frecuencias: frecs.map(function (f) {
        var on = f.id === self.state.frec;
        return Object.assign({}, f, {
          checked: on ? 'true' : 'false',
          pick: function () { self.setState({ frec: f.id }); },
          pillStyle: 'min-height: 44px; padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #5B1A33; color: #FFFFFF; border: 1px solid #5B1A33' : 'background: #FFFFFF; color: #5B1A33; border: 1px solid #CDBDAA')
        });
      }),
      entregaTexto: fAct.n + (fAct.n === 1 ? ' entrega' : ' entregas') + ' por mes, de unos ' + porEntrega + ' kg cada una. Siempre harina recién molida.',
      usos: [
        { t: 'Pastas frescas', d: 'Fettuccine, ravioles y ñoquis con color bordó natural.', dosis: 'Dosis sugerida: [X] % del total' },
        { t: 'Panes y masa madre', d: 'Miga más húmeda, corteza oscura y notas frutales.', dosis: 'Dosis sugerida: [X] % del total' },
        { t: 'Pastelería', d: 'Tartas, galletas, macarons y tapas de alfajor de autor.', dosis: 'Dosis sugerida: [X] % del total' },
        { t: 'Rebozados y costras', d: 'Costras para cordero y carnes de caza, rebozado de pescados.', dosis: 'Dosis sugerida: [X] % del total' },
        { t: 'Salsas y emplatado', d: 'Espesa reducciones oscuras y termina postres espolvoreada.', dosis: 'Uso a gusto, en polvo' }
      ],
      servicios: [
        { t: 'Asesor técnico', d: 'Una persona que conoce tu carta y te acompaña en las pruebas.' },
        { t: 'Fichas de recetas y dosificación', d: 'Para cada aplicación, listas para la brigada.' },

        { t: 'Material para la carta y redes', d: 'Textos sugeridos, origen del lote y maridaje.' },
        { t: 'Entrega programada', d: 'En [ZONAS DE COBERTURA], con la frecuencia que elijas.' },
        { t: 'Facturación mensual', d: 'Un solo cobro por tu plan. ' }
      ],
      faqs: faqData.map(function (f, i) {
        var o = self.state.open === i;

      }),

      noEnviado: !this.state.enviado,
      enviar: function () { self.setState({ enviado: true }); },
      reset: function () { self.setState({ enviado: false }); }
    };
  }
}

(function () {

  function lookup(path, scope) {
    path = path.trim();

    if (node.nodeType !== 1) return;

    if (tag === 'sc-for') {

      var as = node.getAttribute('as') || 'item';

      list.forEach(function (item, i) {

        var c = document.createElement('div'); c.innerHTML = node.innerHTML;
        Array.prototype.slice.call(c.childNodes).forEach(function (ch) { proc(ch, s); frag.appendChild(ch); });
      });
      node.parentNode.replaceChild(frag, node); return;
    }
    if (tag === 'sc-if') {
      var ok = lookup(WHOLE.exec(node.getAttribute('value'))[1], scope);
      if (!ok) { node.parentNode.removeChild(node); return; }
      var kids = Array.prototype.slice.call(node.childNodes);
      kids.forEach(function (ch) { proc(ch, scope); });
      kids.forEach(function (ch) { node.parentNode.insertBefore(ch, node); });
      node.parentNode.removeChild(node); return;
    }
    Array.prototype.slice.call(node.attributes).forEach(function (a) {
      if (a.name.indexOf('hint-') === 0) { node.removeAttribute(a.name); return; }
      if (a.value.indexOf('{{') < 0) return;
      var m = WHOLE.exec(a.value);
      if (/^on/i.test(a.name) && m) {
        var fn = lookup(m[1], scope); node.removeAttribute(a.name);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2).toLowerCase(), function (e) { e.preventDefault(); fn(e); });
        return;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    });
    Array.prototype.slice.call(node.childNodes).forEach(function (ch) { proc(ch, scope); });
  }
  window.__render = function () {
    var saved = {};
    root.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) { saved[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
    var vals = comp.renderVals();
    var c = document.createElement('div'); c.innerHTML = tpl.innerHTML;
    Array.prototype.slice.call(c.childNodes).forEach(function (ch) { proc(ch, vals); });
    root.replaceChildren.apply(root, Array.prototype.slice.call(c.childNodes));
    root.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
      if (!(el.name in saved)) return;
      if (el.type === 'checkbox') el.checked = saved[el.name]; else el.value = saved[el.name];
    });
  };
  window.__render();
})();
